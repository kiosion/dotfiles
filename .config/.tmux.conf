set -g default-terminal "tmux-256color"
set -g history-limit 10000
set -g status-style "fg=#c6d0f5,bg=#303446"
set -g status-position top
set -g status-left "#[fg=#8caaee,bold] #S #[default]"
set -g status-left-length 32
set -g status-right " [Menu] "
set -g status-right-length 8
setw -g window-status-format " #I:#{=24:window_name} "
setw -g window-status-current-format "#[fg=#232634,bg=#8caaee,bold] #I:#{=24:window_name} #[default]"
setw -g window-status-separator " "
set -g menu-style "fg=#c6d0f5,bg=#414559"
set -g menu-selected-style "fg=#232634,bg=#8caaee"
set -g menu-border-style "fg=#8caaee"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -s focus-events on
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf

set -s command-alias[100] "actions=display-menu -OM -T 'tmux actions' -x C -y C \
    'New window' c { new-window -c \"#{pane_current_path}\" } \
    'Rename window' r { command-prompt -I '#W' { rename-window -- '%%' } } \
    'Choose session or window' w { choose-tree -Zw } \
    '' \
    'Split side by side' h { split-window -h -c \"#{pane_current_path}\" } \
    'Split stacked' v { split-window -v -c \"#{pane_current_path}\" } \
    'Zoom or restore pane' z { resize-pane -Z } \
    'Arrange panes in a grid' t { select-layout tiled } \
    '' \
    'New session' S { command-prompt -p 'Session name' { new-session -s '%%' -c \"#{pane_current_path}\" } } \
    'Rename session' R { command-prompt -I '#S' { rename-session -- '%%' } } \
    'Detach' d { detach-client } \
    '' \
    'Cheatsheet' ? { display-popup -E -w 90% -h 90% -T 'tmux help' 'tmux show-options -gqv @help | less -i -M -+F' }"

bind -N 'Open the action menu' Enter actions
bind -n MouseDown1StatusRight actions

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @help 'TMUX HELP
Press Ctrl+B and release it before the command key.
Scroll with j/k or arrows. Search with /. Close with q.
Click [Menu] in the top bar or press Ctrl+B Enter for actions.

Sessions
  s           Choose a session
  w           Choose a session or window
  $           Rename the current session
  d           Detach while commands continue running
  ( / )       Previous / next session

Windows
  c           New window in the current directory
  n / p       Next / previous window
  1-9         Select a numbered window
  ,           Rename the current window
  &           Close the window (confirmation)

Panes
  | / -       Split side by side / stacked
  h/j/k/l     Select an adjacent pane
  H/J/K/L     Resize; repeat within 500ms without another prefix
  z           Toggle zoom
  Space       Cycle pane layouts
  x           Close the pane (confirmation)

Copy mode
  [           Enter copy mode or scroll history
  v / y / q   Select / copy / cancel in copy mode
  ]           Paste the tmux buffer
  Shift+drag  Use Ghostty text selection instead of tmux selection

Session commands at the shell prompt
  tm                                   Open the session picker
  tm core                              Create, attach, or switch to core
  tmux ls                              List sessions
  tmux new-session -A -s core           Create or attach to core
  tmux attach -t core                   Attach from another terminal
  tmux attach -r -t core                Attach with read-only input
  tmux switch-client -t core            Switch from inside tmux
  tmux rename-session -t core work      Rename core to work
  tmux list-clients                     List attached terminals
  tmux kill-session -t core             End core and unshared windows
  tmux new-session -t core -s core-view Share windows, select independently

Commands after Ctrl+B : (omit the tmux prefix)
  list-keys                Show all bindings
  list-windows             List windows
  list-panes -a            List panes across all sessions
  select-layout tiled      Arrange panes in a grid
  break-pane               Move the current pane into a new window
  source-file ~/.tmux.conf  Reload the config

Sessions attached in multiple terminals share the current window.
Grouped sessions share windows but select their current window separately.
Closing a pane or destroying its window ends the processes in that pane.'

bind -N 'Open the tmux cheatsheet' ? display-popup -E -w 90% -h 90% -T 'tmux help' 'tmux show-options -gqv @help | less -i -M -+F'
