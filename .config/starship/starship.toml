# Inserts a blank line between shell prompts
add_newline = true

# Explicit format — skips detection for unlisted modules
format = """$username$hostname$directory$git_branch$git_status$golang$nodejs$rust[\\$](green bold) """

command_timeout = 500

[character]
disabled = true

[line_break]
disabled = true

[golang]
format = "via [$symbol($version )]($style)"

[nodejs]
symbol = "💠 "
format = "via [$symbol($version )]($style)"

[rust]
format = "via [$symbol($version )]($style)"

# Username config
[username]
show_always = true
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style)"

# Hostname config
[hostname]
ssh_only = false
format = " @ [$hostname](green bold) in "
disabled = false

# Dir config
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 🔒"

